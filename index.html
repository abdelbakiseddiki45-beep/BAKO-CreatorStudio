<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-font="md">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAKO CREATOR STUDIO 🔥</title>
<style>
/* ================= BASE ================= */
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#ff6a00;--accent2:#ff2d55;--ok:#22c55e;--danger:#ef4444;--radius:16px;--sidebar-w:252px}
html[data-theme="dark"]{--bg:#070b14;--bg2:#0c1220;--panel:#101828;--panel2:#182236;--field:#0b111e;--text:#e9edf6;--muted:#8d96ac;--border:rgba(255,255,255,.09);--shadow:0 12px 30px rgba(0,0,0,.45)}
html[data-theme="light"]{--bg:#eef1f7;--bg2:#e3e8f2;--panel:#ffffff;--panel2:#f2f4fb;--field:#ffffff;--text:#141a2e;--muted:#5c6580;--border:rgba(20,30,60,.12);--shadow:0 8px 22px rgba(30,41,59,.10)}
html[data-font="sm"]{font-size:14px}
html[data-font="md"]{font-size:15.5px}
html[data-font="lg"]{font-size:17.5px}
html{scroll-behavior:smooth}
body{font-family:"Segoe UI",Tahoma,system-ui,-apple-system,Arial,sans-serif;color:var(--text);min-height:100vh;
background:radial-gradient(1100px 500px at 85% -10%,rgba(255,106,0,.13),transparent 60%),radial-gradient(900px 420px at 8% 110%,rgba(255,45,85,.10),transparent 55%),var(--bg)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
.hidden{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--panel2);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* ================= LAYOUT ================= */
#app{display:flex;min-height:100vh}
#sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sidebar-w);background:var(--bg2);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;z-index:60;transition:transform .3s ease}
main{flex:1;margin-inline-start:var(--sidebar-w);min-width:0;display:flex;flex-direction:column}
.side-logo{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid var(--border)}
.logo-badge{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;color:#fff;box-shadow:0 6px 18px rgba(255,80,20,.35);flex-shrink:0}
.logo-txt{font-weight:900;font-size:1.05rem;letter-spacing:.5px;line-height:1.15}
.logo-txt span{display:block;font-size:.62rem;color:var(--muted);font-weight:600;letter-spacing:1.5px}
#sidebar nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;background:transparent;border:1px solid transparent;color:var(--text);font-size:.95rem;font-weight:600;text-align:start;transition:.2s}
.nav-item:hover{background:var(--panel);border-color:var(--border)}
.nav-item.active{background:linear-gradient(135deg,rgba(255,106,0,.18),rgba(255,45,85,.14));border-color:rgba(255,106,0,.4);color:var(--text)}
.nav-item .ni{width:24px;text-align:center}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.78rem}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:.25s}
#backdrop.show{opacity:1;pointer-events:auto}

/* ================= TOPBAR ================= */
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--border)}
#menuBtn{display:none;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:1.15rem}
.tb-title{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--muted)}
.badge-pro{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;width:38px;height:38px;font-size:1rem;transition:.2s}
.icon-btn:hover{border-color:var(--accent)}

/* ================= PAGES ================= */
#pages{padding:22px;max-width:1080px;width:100%;margin-inline:auto;flex:1}
.page{display:none}
.page.active{display:block;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.page h2.sec{margin:26px 0 14px;font-size:1.15rem}

/* ================= CARDS ================= */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}
.fcard{cursor:pointer;text-align:center;padding:22px 14px;transition:.25s;position:relative;overflow:hidden}
.fcard:hover{transform:translateY(-4px);border-color:rgba(255,106,0,.5);box-shadow:0 14px 30px rgba(255,80,20,.15)}
.fcard .f-ico{font-size:1.9rem;margin-bottom:8px}
.fcard h3{font-size:.98rem;margin-bottom:5px}
.fcard p{font-size:.78rem;color:var(--muted);line-height:1.5}

/* ================= HERO ================= */
.hero{text-align:center;padding:52px 24px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 50% 20%,rgba(255,106,0,.14),transparent 55%);pointer-events:none}
.hero-logo{font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;letter-spacing:1px}
.hero h1{font-size:clamp(1.5rem,4.5vw,2.4rem);font-weight:900;margin-bottom:8px}
.hero p.sub{color:var(--muted);font-size:1.05rem;margin-bottom:22px}
.hero-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}

/* ================= BUTTONS ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:10px 18px;font-weight:700;font-size:.92rem;border:1px solid var(--border);background:var(--panel2);color:var(--text);transition:.2s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:rgba(255,106,0,.5)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;box-shadow:0 8px 20px rgba(255,80,20,.3)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{background:var(--danger);color:#fff;border:none}
.btn-ghost{background:transparent}
.btn-lg{padding:14px 28px;font-size:1.05rem;border-radius:14px}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:9px}
.btn.copied{background:var(--ok);color:#fff;border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

/* ================= FORMS ================= */
.input{width:100%;background:var(--field);border:1px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);outline:none;transition:.2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,106,0,.15)}
.input:disabled{opacity:.45;cursor:not-allowed}
textarea.input{resize:vertical;min-height:70px;line-height:1.7}
select.input{appearance:none;cursor:pointer}
.lbl{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.field{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:16px}

/* ================= RESULTS ================= */
.results-head{margin:24px 0 16px}
.rcard{margin-bottom:16px;animation:fadeUp .4s ease both}
.rc-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rc-head h3{font-size:1.02rem;font-weight:800}
.rc-head .btn{margin-inline-start:auto}
.title-row{display:flex;gap:10px;align-items:center;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);margin-bottom:8px}
.title-row .num{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:800;flex-shrink:0}
.title-row .title-txt{flex:1;line-height:1.6;font-size:.94rem}
.s-block{border:1px solid var(--border);border-radius:12px;background:var(--panel2);padding:14px;margin-bottom:10px}
.s-label{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.7rem;font-weight:800;color:#fff;margin-bottom:8px;letter-spacing:.5px}
.lb-hook{background:linear-gradient(135deg,#ff512f,#dd2476)}
.lb-intro{background:linear-gradient(135deg,#11998e,#38ef7d)}
.lb-main{background:linear-gradient(135deg,#396afc,#2948ff)}
.lb-end{background:linear-gradient(135deg,#f7971e,#ffd200);color:#333}
.lb-cta{background:linear-gradient(135deg,#8e2de2,#4a00e0)}
.s-block p{line-height:1.8;font-size:.93rem}
.s-item{padding:8px 0;border-bottom:1px dashed var(--border)}
.s-item:last-child{border-bottom:none}
.s-sub{font-weight:800;font-size:.88rem;color:var(--accent);margin-bottom:3px}
.prewrap{white-space:pre-wrap;word-break:break-word;line-height:1.9;font-size:.93rem;font-family:inherit}
.tags-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag{background:var(--panel2);border:1px solid var(--border);padding:5px 12px;border-radius:999px;font-size:.83rem;font-weight:600}
.thumb-item{border:1px solid var(--border);border-radius:12px;background:var(--panel2);padding:14px;margin-bottom:10px}
.thumb-head{display:flex;align-items:center;font-weight:800;font-size:.9rem;margin-bottom:10px}
.thumb-head .btn{margin-inline-start:auto}
.thumb-item dl div{display:flex;gap:8px;padding:4px 0;font-size:.87rem;line-height:1.6}
.thumb-item dt{min-width:118px;color:var(--muted);font-weight:700;flex-shrink:0}
.thumb-item dd{flex:1}

/* ================= IDEAS ================= */
.chips-row{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:8px 15px;font-size:.85rem;font-weight:600;transition:.2s;text-align:start}
.chip:hover{border-color:var(--accent);transform:translateY(-2px)}
.ideas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.idea-card{display:flex;flex-direction:column;gap:10px}
.idea-card p{flex:1;line-height:1.7;font-size:.93rem}
.gen-idea{margin-top:16px;border:1px dashed rgba(255,106,0,.5);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--panel2);animation:fadeUp .3s both}
.gen-idea-txt{font-size:1.05rem;font-weight:700;line-height:1.7}

/* ================= SAVED ================= */
.proj{margin-bottom:12px}
.proj.pinned{border-color:rgba(255,106,0,.55)}
.proj-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj-name{font-weight:800}
.proj-idea{color:var(--muted);font-size:.88rem;margin:7px 0;line-height:1.6}
.proj-meta{font-size:.76rem;color:var(--muted);margin-bottom:12px}
.proj-actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty-ico{font-size:2.6rem;margin-bottom:10px}

/* ================= LOADING ================= */
#loadingOverlay{position:fixed;inset:0;background:rgba(5,8,15,.8);z-index:200;display:flex;align-items:center;justify-content:center}
.load-card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px 42px;text-align:center;max-width:88vw;animation:fadeUp .3s both}
.spinner{width:56px;height:56px;border-radius:50%;border:4px solid var(--panel2);border-top-color:var(--accent);border-inline-end-color:var(--accent2);animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-logo{font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
#loadText{color:var(--muted);font-size:.9rem;min-height:22px}
.load-track{height:7px;background:var(--panel2);border-radius:99px;margin-top:18px;overflow:hidden}
#loadBar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .45s ease}

/* ================= TOAST ================= */
#toastWrap{position:fixed;bottom:20px;inset-inline-end:20px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:min(340px,90vw)}
.toast{background:var(--panel);border:1px solid var(--border);border-inline-start:4px solid var(--ok);border-radius:12px;padding:12px 16px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow);animation:toastIn .3s ease both}
.toast.err{border-inline-start-color:var(--danger)}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ================= MODAL ================= */
#modalOverlay{position:fixed;inset:0;background:rgba(5,8,15,.7);z-index:250;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:430px;animation:fadeUp .25s both}
.modal-card h3{margin-bottom:14px;font-size:1.05rem}
#modalBody{margin-bottom:20px;line-height:1.7;font-size:.93rem}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.note{font-size:.8rem;color:var(--muted);line-height:1.7;margin-top:12px;padding:10px 13px;background:var(--panel2);border-radius:10px;border:1px dashed var(--border)}


/* ================= BAKO ASSISTANT LITE ================= */
.assistant-card{max-width:900px;margin:auto}
.assistant-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.assistant-chat{min-height:260px;max-height:52vh;overflow:auto;padding:12px;background:var(--field);border:1px solid var(--border);border-radius:14px}
.assistant-msg{max-width:88%;padding:10px 13px;border-radius:13px;margin:7px 0;line-height:1.7;font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.assistant-msg.bot{background:var(--panel2);border:1px solid var(--border);margin-inline-end:auto}
.assistant-msg.user{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-inline-start:auto}
.assistant-compose{margin-top:12px}

/* ================= RESPONSIVE ================= */
@media(max-width:920px){
 #sidebar{transform:translateX(-108%)}
 [dir="rtl"] #sidebar{transform:translateX(108%)}
 #sidebar.open{transform:translateX(0)!important;box-shadow:0 0 60px rgba(0,0,0,.5)}
 main{margin-inline-start:0}
 #menuBtn{display:inline-flex;align-items:center;justify-content:center}
 #pages{padding:14px}
 .hero{padding:36px 16px}
 .thumb-item dl div{flex-direction:column;gap:2px}
 .thumb-item dt{min-width:0}
 #toastWrap{inset-inline-end:50%;transform:translateX(50%)}
}
</style>
</head>
<body>

<div id="app">
 <!-- ============ SIDEBAR ============ -->
 <aside id="sidebar">
  <div class="side-logo">
   <div class="logo-badge">B</div>
   <div class="logo-txt">BAKO 🔥<span>CREATOR STUDIO</span></div>
  </div>
  <nav>
   <button class="nav-item active" data-page="home"><span class="ni">🏠</span><span data-i18n="nav_home"></span></button>
   <button class="nav-item" data-page="create"><span class="ni">✍️</span><span data-i18n="nav_create"></span></button>
   <button class="nav-item" data-page="ideas"><span class="ni">🎬</span><span data-i18n="nav_ideas"></span></button>
   <button class="nav-item" data-page="thumb"><span class="ni">🖼️</span><span data-i18n="nav_thumb"></span></button>
   <button class="nav-item" data-page="voice"><span class="ni">🎙️</span><span data-i18n="nav_voice"></span></button>
<button class="nav-item" data-page="assistant"><span class="ni">🤖</span><span data-i18n="nav_assistant"></span></button>
   <button class="nav-item" data-page="saved"><span class="ni">📚</span><span data-i18n="nav_saved"></span></button>
   <button class="nav-item" data-page="settings"><span class="ni">⚙️</span><span data-i18n="nav_settings"></span></button>
  </nav>
  <div class="side-foot"><span class="badge">v1.1 LITE</span><span data-i18n="offline_badge"></span></div>
 </aside>
 <div id="backdrop"></div>

 <main>
  <!-- ============ TOPBAR ============ -->
  <header id="topbar">
   <button id="menuBtn" aria-label="menu">☰</button>
   <div class="tb-title" id="pageTitle"></div>
   <div class="tb-actions">
    <span class="badge badge-pro">🔥 PRO</span>
    <button class="icon-btn" id="themeQuick" title="theme">☀️</button>
   </div>
  </header>

  <div id="pages">
   <!-- ============ HOME ============ -->
   <section class="page active" id="page-home">
    <div class="card hero">
     <div class="hero-logo">BAKO 🔥</div>
     <h1>BAKO CREATOR STUDIO</h1>
     <p class="sub" data-i18n="home_tagline"></p>
     <button class="btn btn-primary btn-lg" id="homeCta" data-i18n="home_cta"></button>
     <div class="hero-stats">
      <span class="badge" data-i18n="stat1"></span>
      <span class="badge" data-i18n="stat2"></span>
      <span class="badge" data-i18n="stat3"></span>
     </div>
    </div>
    <h2 class="sec" data-i18n="home_tools"></h2>
    <div class="fgrid">
     <div class="card fcard" data-nav="create"><div class="f-ico">🎬</div><h3 data-i18n="f_title_t"></h3><p data-i18n="f_title_d"></p></div>
     <div class="card fcard" data-nav="create"><div class="f-ico">📝</div><h3 data-i18n="f_script_t"></h3><p data-i18n="f_script_d"></p></div>
     <div class="card fcard" data-nav="create"><div class="f-ico">📄</div><h3 data-i18n="f_desc_t"></h3><p data-i18n="f_desc_d"></p></div>
     <div class="card fcard" data-nav="create"><div class="f-ico">#️⃣</div><h3 data-i18n="f_hash_t"></h3><p data-i18n="f_hash_d"></p></div>
     <div class="card fcard" data-nav="thumb"><div class="f-ico">🖼️</div><h3 data-i18n="f_thumb_t"></h3><p data-i18n="f_thumb_d"></p></div>
     <div class="card fcard" data-nav="voice"><div class="f-ico">🎙️</div><h3 data-i18n="f_voice_t"></h3><p data-i18n="f_voice_d"></p></div>
    </div>
    <h2 class="sec" data-i18n="home_trend"></h2>
    <div class="chips-row" id="homeTrend"></div>
   </section>

   <!-- ============ CREATE ============ -->
   <section class="page" id="page-create">
    <div class="card">
     <h2 style="margin-bottom:16px" data-i18n="create_title"></h2>
     <div class="field">
      <label class="lbl" data-i18n="idea_label"></label>
      <textarea id="ideaInput" class="input" rows="4"></textarea>
     </div>
     <div class="form-grid">
      <div><label class="lbl" data-i18n="platform_label"></label>
       <select id="selPlatform" class="input">
        <option value="youtube">YouTube</option><option value="yshorts">YouTube Shorts</option>
        <option value="tiktok">TikTok</option><option value="reels">Instagram Reels</option><option value="facebook">Facebook</option>
       </select></div>
      <div><label class="lbl" data-i18n="type_label"></label>
       <select id="selType" class="input">
        <option value="gaming" data-i18n="type_gaming"></option><option value="technology" data-i18n="type_technology"></option>
        <option value="tutorial" data-i18n="type_tutorial"></option><option value="entertainment" data-i18n="type_entertainment"></option>
        <option value="education" data-i18n="type_education"></option><option value="news" data-i18n="type_news"></option>
        <option value="other" data-i18n="type_other"></option>
       </select></div>
      <div><label class="lbl" data-i18n="clang_label"></label>
       <select id="selLang" class="input">
        <option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option>
       </select></div>
      <div><label class="lbl" data-i18n="tone_label"></label>
       <select id="selTone" class="input">
        <option value="professional" data-i18n="tone_professional"></option><option value="energetic" data-i18n="tone_energetic"></option>
        <option value="short" data-i18n="tone_short"></option><option value="funny" data-i18n="tone_funny"></option>
        <option value="formal" data-i18n="tone_formal"></option>
       </select></div>
      <div><label class="lbl" data-i18n="len_label"></label>
       <select id="selLen" class="input">
        <option value="short" data-i18n="len_short"></option><option value="medium" data-i18n="len_medium" selected></option><option value="long" data-i18n="len_long"></option>
       </select></div>
     </div>

/* ================= GENERATOR ENGINE ================= */
function tuneTitle(x,tone){
 if(tone==='energetic')return x+' '+pick(['🔥','⚡','🚀','💥']);
 if(tone==='funny')return x+' '+pick(['😂','🤣','😅']);
 if(tone==='formal'||tone==='professional')return stripEmoji(x);
 return x;
}
function ideaWords(idea,T){
 return idea.replace(/[^\p{L}\p{N}\s]/gu,'').split(/\s+/).filter(w=>w.length>2&&!T.stop.has(w.toLowerCase()));
}
function buildHashtags(T,o,idea){
 const set=new Set();
 (T.tagsBase[o.type]||T.tagsBase.other).forEach(x=>set.add(x));
 (T.tagsPlat[o.platform]||[]).forEach(x=>set.add(x));
 ideaWords(idea,T).slice(0,5).forEach(w=>set.add('#'+w));
 set.add('#'+YEAR);
 return Array.from(set).slice(0,14);
}
function buildKeywords(T,o,idea){
 const s=new Set();
 (T.kwBase[o.type]||T.kwBase.other).forEach(k=>s.add(k));
 ideaWords(idea,T).slice(0,6).forEach(w=>s.add(w+' '+YEAR));
 s.add((T.kwPlat[o.platform]||'YouTube')+' '+YEAR);
 return Array.from(s).slice(0,15);
}
function buildDesc(T,o,script,hashtags,v){
 const lines=[fill(pick(T.descOpen),v),'',T.chTitle,'00:00 '+T.chIntro];
 script.main.forEach((it,i)=>{const mm=String((i+1)*2).padStart(2,'0');lines.push(mm+':'+pick(['10','25','40','55'])+' '+it.t);});
 lines.push(String((script.main.length+1)*2).padStart(2,'0')+':00 '+T.chEnd);
 lines.push('',fill(pick(T.ctas[o.platform]||T.ctas.youtube),v),'',hashtags.join(' '),T.descFoot);
 return lines.join('\n');
}
function generateContent(o){
 const lang=['ar','en','fr'].indexOf(o.lang)>=0?o.lang:'en';
 const T=CONTENT_TPL[lang];
 const idea=o.idea.trim();
 const short=idea.split(/\s+/).slice(0,4).join(' ');
 const v={idea:idea,short:short,year:YEAR};
 const titles=shuffle(T.titles.map(x=>fill(x,v))).slice(0,5).map(x=>tuneTitle(x,o.tone));
 const hook=fill(pick(T.hooks[o.tone]||T.hooks.professional),v);
 const intro=fill(pick(T.intros),v)+' '+fill(pick(T.plat[o.platform]||T.plat.youtube),v);
 const n=o.length==='short'?3:(o.length==='long'?7:5);
 const secs=T.sections[o.type]||T.sections.other;
 const main=[];
 for(let i=0;i<n;i++){const sTitle=secs[i%secs.length];main.push({t:sTitle,b:fill(pick(T.points),{idea:idea,short:short,year:YEAR,s:sTitle,n:i+1})});}
 const ending=fill(pick(T.endings[o.tone]||T.endings.professional),v);
 const cta=fill(pick(T.ctas[o.platform]||T.ctas.youtube),v);
 const script={hook:hook,intro:intro,main:main,ending:ending,cta:cta};
 const hashtags=buildHashtags(T,o,idea);
 const thumbs=T.thumbs(v);
 const voice=[stripEmoji(hook),stripEmoji(fill(pick(T.intros),v))].concat(script.main.map(it=>stripEmoji(it.b))).concat([stripEmoji(ending),stripEmoji(cta)]).join('\n\n');
 const description=buildDesc(T,o,script,hashtags,v);
 const keywords=buildKeywords(T,o,idea);
 return {idea:idea,opts:Object.assign({},o),lang:lang,titles:titles,script:script,description:description,hashtags:hashtags,thumbs:thumbs,voice:voice,keywords:keywords};
}

/* ================= OPTIONAL REMOTE API ================= */
async function callRemoteAPI(o){
 const provider=settings.apiProvider;
 const url=provider==='openai'?'https://api.openai.com/v1/chat/completions':settings.apiUrl;
 if(!url)return null;
 const body={model:settings.apiModel||'gpt-4o-mini',temperature:0.9,messages:[{role:'user',content:'You are a content creation assistant. Idea: "'+o.idea+'". Platform: '+o.platform+'. Tone: '+o.tone+'. Language: '+o.lang+'. Return ONLY strict JSON: {"titles":[5 strings],"description":"string","hashtags":["strings"],"keywords":["strings"],"voice":"string"}'}]};
 const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+settings.apiKey},body:JSON.stringify(body)});
 if(!res.ok)throw new Error('bad status');
 const j=await res.json();
 const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
 const m=txt.match(/\{[\s\S]*\}/);
 if(!m)return null;
 return JSON.parse(m[0]);
}
function validResult(r){return r&&Array.isArray(r.titles)&&r.titles.length>0&&typeof r.description==='string';}
function normalizeResult(r,o){
 const base=generateContent(o);
 return Object.assign({},base,{
  titles:r.titles.slice(0,6),
  description:r.description||base.description,
  hashtags:Array.isArray(r.hashtags)&&r.hashtags.length?r.hashtags:base.hashtags,
  keywords:Array.isArray(r.keywords)&&r.keywords.length?r.keywords:base.keywords,
  voice:typeof r.voice==='string'&&r.voice?r.voice:base.voice});
}

function copyText(text,btn){
 const done=ok=>{
  if(btn){const old=btn.innerHTML;btn.classList.add('copied');btn.innerHTML=ok?'✅ '+t('copied').replace('✅','').trim():'❌';
   setTimeout(()=>{btn.innerHTML=old;btn.classList.remove('copied');},2000);}
  if(ok)toast(t('t_copied'));
 };
 const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);done(true);}catch(e){done(false);}};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>done(true)).catch(fallback);}else{fallback();}
}
function fmtDate(iso){
 try{const d=new Date(iso);const loc=settings.uiLang==='ar'?'ar-EG':'en-GB';
  return d.toLocaleDateString(loc,{year:'numeric',month:'short',day:'numeric'})+' • '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}
}

function thumbToText(th){return t('th_el')+': '+th.el+'\n'+t('th_col')+': '+th.col+'\n'+t('th_txt')+': '+th.txt+'\n'+t('th_char')+': '+th.char+'\n'+t('th_bg')+': '+th.bg+'\n'+t('th_comp')+': '+th.comp;}
function scriptToText(s){
 const L=['[HOOK]',s.hook,'','[INTRO]',s.intro,'','[MAIN CONTENT]'];
 s.main.forEach(it=>L.push('• '+it.t+': '+it.b));
 L.push('','[ENDING]',s.ending,'','[CTA]',s.cta);
 return L.join('\n');
}
function resolveCopy(res,kind,idx){
 if(!res)return '';
 switch(kind){
  case 'title':return res.titles[+idx]||'';
  case 'script':return scriptToText(res.script);
  case 'desc':return res.description;
  case 'hash':return res.hashtags.join(' ');
  case 'thumb':return res.thumbs[+idx]?thumbToText(res.thumbs[+idx]):'';
  case 'voice':return res.voice;
  case 'keys':return res.keywords.join(', ');
 }
 return '';
}
function allText(res){

 L.push('== '+t('c_script')+' ==',scriptToText(res.script),'');
 L.push('== '+t('c_desc')+' ==',res.description,'');
 L.push('== '+t('c_hash')+' ==',res.hashtags.join(' '),'');
 L.push('== '+t('c_thumb')+' ==');res.thumbs.forEach((th,i)=>L.push('#'+(i+1)+'\n'+thumbToText(th),''));
 L.push('== '+t('c_voice')+' ==',res.voice,'');
 L.push('== '+t('c_keys')+' ==',res.keywords.join(', '));
 return L.join('\n');
}
function attachCopyHandler(el,getRes){
 el.addEventListener('click',e=>{
  const b=e.target.closest('[data-act="copy"]');if(!b)return;
  const res=getRes();if(!res)return;
  copyText(resolveCopy(res,b.dataset.kind,b.dataset.idx),b);
 });
}

function readForm(){return{idea:$('#ideaInput').value.trim(),platform:$('#selPlatform').value,type:$('#selType').value,lang:$('#selLang').value,tone:$('#selTone').value,length:$('#selLen').value};}
function handleGenerate(optsOverride){
 const opts=optsOverride||readForm();
 if(!opts.idea){toast(t('t_err_empty'),'err');$('#ideaInput').focus();return;}
 if(!optsOverride)state.lastOpts=opts;
 showLoading();
 const useApi=location.protocol!=='file:'&&settings.apiProvider!=='none'&&settings.apiKey.trim();
 const prm=useApi?callRemoteAPI(opts).catch(()=>null):Promise.resolve(null);
 const minDelay=new Promise(r=>setTimeout(r,450+Math.random()*250));
 Promise.all([prm,minDelay]).then(arr=>{
  const remote=arr[0];
  const res=validResult(remote)?normalizeResult(remote,opts):generateContent(opts);
  state.currentResult=res;
  hideLoading();
  renderResults(res);
  $('#resultsArea').classList.remove('hidden');
  toast(t('t_done'));
  setTimeout(()=>$('#resultsArea').scrollIntoView({behavior:'smooth',block:'start'}),350);
 }).catch(()=>{hideLoading();toast(t('t_err'),'err');});
}
function detectType(s){
 const m={gaming:/لعب|game|gaming|jeu/i,technology:/هاتف|تطبيق|حاسوب|تقني|لابتوب|ذكاء|phone|app|tech|pc|laptop|ai/i,tutorial:/شرح|كيف|طريقة|خطوة|how|tutorial|guide|étape/i,education:/تعل|درس|كتاب|learn|study|book|apprendre/i,news:/خبر|أخبار|عاجل|news|actualité/i,entertainment:/تحدي|مقلب|رد فعل|challenge|prank|react|défi/i};
 for(const k in m){if(m[k].test(s))return k;}
 return 'other';
}

/* ================= SAVED PROJECTS ================= */
function renderSaved(){
 const list=loadArr('bako_projects').sort((a,b)=>((b.pinned?1:0)-(a.pinned?1:0))||(new Date(b.date)-new Date(a.date)));
 const el=$('#savedList');
 if(!list.length){el.innerHTML='<div class="card empty"><div class="empty-ico">📚</div><p>'+esc(t('no_saved'))+'</p></div>';return;}
 el.innerHTML=list.map(p=>'<div class="card proj'+(p.pinned?' pinned':'')+'">'+
  '<div class="proj-top"><span class="proj-name">'+esc(p.name)+'</span>'+(p.pinned?'<span class="badge">📌</span>':'')+(p.favorite?'<span class="badge">⭐</span>':'')+'</div>'+
  '<p class="proj-idea">'+esc(p.idea)+'</p>'+
  '<div class="proj-meta">🗓️ '+fmtDate(p.date)+'</div>'+
  '<div class="proj-actions">'+
  '<button class="btn btn-sm btn-primary" data-sact="open" data-id="'+p.id+'">📂 '+t('open_p')+'</button>'+
  '<button class="btn btn-sm" data-sact="pin" data-id="'+p.id+'">📌</button>'+
  '<button class="btn btn-sm" data-sact="fav" data-id="'+p.id+'">'+(p.favorite?'⭐':'☆')+'</button>'+
  '<button class="btn btn-sm btn-danger" data-sact="del" data-id="'+p.id+'">🗑️ '+t('del_p')+'</button>'+
  '</div></div>').join('');
}

/* ================= IDEAS / TREND ================= */
function useIdea(idea,type){
 $('#ideaInput').value=idea;
 if(type)setVal('#selType',type);
 navigate('create');
 toast('✍️ '+t('t_idea_set'));
}
function renderTrend(){
 const pool=IDEA_POOL[settings.uiLang==='ar'?'ar':'en'];
 const types=Object.keys(pool);
 const trend=[];const used={};
 let guard=0;
 while(trend.length<6&&guard<60){guard++;const ty=pick(types);const it=pick(pool[ty]);if(used[it])continue;used[it]=1;trend.push({idea:it,type:ty});}
 $('#homeTrend').innerHTML=trend.slice(0,5).map(x=>'<button class="chip" data-idea="'+esc(x.idea)+'" data-type="'+x.type+'">🔥 '+esc(x.idea)+'</button>').join('');
 $('#trendList').innerHTML=trend.map(x=>'<div class="card idea-card"><span class="badge">'+esc(t('type_'+x.type))+'</span><p>'+esc(x.idea)+'</p><button class="btn btn-sm btn-primary" data-idea="'+esc(x.idea)+'" data-type="'+x.type+'">'+t('use_idea')+'</button></div>').join('');
}

/* ================= I18N APPLY ================= */
function applyI18n(){
 $$('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
 $$('[data-i18n-ph]').forEach(el=>{el.setAttribute('placeholder',t(el.dataset.i18nPh));});
 const ar=settings.uiLang==='ar';
 document.documentElement.lang=ar?'ar':'en';
 document.documentElement.dir=ar?'rtl':'ltr';
 $('#pageTitle').textContent=t(PAGE_KEYS[state.page]);
}
function applySettings(){
 const h=document.documentElement;
 h.dataset.theme=settings.theme;
 h.dataset.font=settings.fontSize;
 applyI18n();
 $('#themeQuick').textContent=settings.theme==='dark'?'☀️':'🌙';
 setVal('#setTheme',settings.theme);setVal('#setUiLang',settings.uiLang);setVal('#setFont',settings.fontSize);
 setVal('#setProvider',settings.apiProvider);
 $('#setApiUrl').value=settings.apiUrl;$('#setApiKey').value=settings.apiKey;$('#setModel').value=settings.apiModel;
 updateApiFields();
 renderTrend();renderSaved();
 if(state.currentResult)renderResults(state.currentResult);
}
function updateApiFields(){
 const p=$('#setProvider').value;
 const off=p==='none';
 $('#setApiKey').disabled=off;$('#setModel').disabled=off;
 $('#setApiUrl').disabled=off||p==='openai';
 if(p==='openai')$('#setApiUrl').value='https://api.openai.com/v1/chat/completions';
}


/* ================= BAKO LOCAL ASSISTANT ================= */
function assistantAdd(text,who){
  const box=$('#assistantChat'); if(!box)return;
  const d=document.createElement('div');
  d.className='assistant-msg '+(who==='user'?'user':'bot');
  d.textContent=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}
function assistantReply(q){
  const x=q.trim(), low=x.toLowerCase(), lang=settings.uiLang==='ar'?'ar':'en';
  const ideas=IDEA_POOL[lang];
  if(/فكرة|idea|ideas/.test(low)){
    const type=$('#selType')?.value||'gaming', pool=ideas[type]||ideas.other;
    return lang==='ar'
      ? '💡 فكرة مناسبة:\\n'+pick(pool)+'\\n\\n🔥 Hook:\\n"توقف! هناك شيء مهم يجب أن تعرفه قبل أن تبدأ..."'
      : '💡 A good idea:\\n'+pick(pool)+'\\n\\n🔥 Hook:\\n"Stop scrolling! There is one thing you need to know first..."';
  }
  if(/عنوان|title|titles/.test(low)){
    const idea=$('#ideaInput')?.value.trim()||'فيديو جديد';
    const r=generateContent({idea,platform:'youtube',type:detectType(idea),lang,tone:'energetic',length:'short'});
    return (lang==='ar'?'🔥 3 عناوين قوية:\\n':'🔥 3 strong titles:\\n')+r.titles.slice(0,3).join('\\n');
  }
  if(/thumbnail|صورة|مصغرة/.test(low)){
    const idea=$('#ideaInput')?.value.trim()||'فيديو جديد';
    const r=generateContent({idea,platform:'youtube',type:detectType(idea),lang,tone:'energetic',length:'short'});
    return (lang==='ar'?'🖼️ أفضل فكرة Thumbnail:\\n':'🖼️ Best thumbnail concept:\\n')+thumbToText(r.thumbs[0]);
  }
  if(/hook|افتتاح|مقدمة/.test(low)){
    const idea=$('#ideaInput')?.value.trim()||'فيديو جديد';
    const r=generateContent({idea,platform:'youtube',type:detectType(idea),lang,tone:'energetic',length:'short'});
    return '🔥 '+r.script.hook;
  }
  if(/هاشت|hashtag|seo|كلمات/.test(low)){
    const idea=$('#ideaInput')?.value.trim()||'فيديو جديد';
    const r=generateContent({idea,platform:'youtube',type:detectType(idea),lang,tone:'professional',length:'short'});
    return (lang==='ar'?'#️⃣ هاشتاغات:\\n':'#️⃣ Hashtags:\\n')+r.hashtags.join(' ')+'\\n\\n🔎 '+r.keywords.join(', ');
  }
  if(/تحسين|improve|قوي|better|نصيحة|tip/.test(low)){
    return lang==='ar'
      ? '🚀 لتحسين الفيديو: Hook قوي في أول 3 ثوانٍ، بدون مقدمة طويلة، عنوان واضح، Thumbnail بعنصر رئيسي واحد ونص قصير، ونهاية بسؤال يدفع للتعليق.'
      : '🚀 Improve the video: use a strong hook in the first 3 seconds, remove long intros, keep the title clear, use one main thumbnail subject with short text, and end with a question that invites comments.';
  }
  return lang==='ar'
    ? '🤖 أستطيع مساعدتك في العناوين، Hooks، السكربت، Thumbnail، الهاشتاغات، SEO وأفكار الفيديو. جرّب: "أعطني 5 عناوين".'
    : '🤖 I can help with titles, hooks, scripts, thumbnails, hashtags, SEO and video ideas. Try: "Give me 5 titles".';
}
function initAssistant(){
  const q=$('#assistantQuick');
  if(q){
    const quick=[['🎯 5 عناوين','عنوان'],['🔥 Hook قوي','Hook'],['🖼️ Thumbnail','Thumbnail'],['💡 فكرة فيديو','فكرة']];
    q.innerHTML=quick.map(a=>'<button class="chip" data-assistant="'+esc(a[1])+'">'+a[0]+'</button>').join('');
    q.addEventListener('click',e=>{
      const b=e.target.closest('[data-assistant]'); if(!b)return;
      $('#assistantInput').value=b.dataset.assistant; $('#assistantSend').click();
    });
  }
  $('#assistantSend')?.addEventListener('click',()=>{
    const input=$('#assistantInput'), text=input.value.trim();
    if(!text)return;
    assistantAdd(text,'user'); input.value='';
    setTimeout(()=>assistantAdd(assistantReply(text),'bot'),90);
  });
  $('#assistantInput')?.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#assistantSend').click();}
  });
  $('#assistantClear')?.addEventListener('click',()=>{
    $('#assistantChat').innerHTML='<div class="assistant-msg bot">'+esc(t('assistant_welcome'))+'</div>';
  });
}

/* ================= INIT & EVENT LISTENERS ================= */
function init(){
 /* navigation */
 $$('.nav-item').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
 $$('.fcard').forEach(c=>c.addEventListener('click',()=>navigate(c.dataset.nav)));
 $('#homeCta').addEventListener('click',()=>{navigate('create');$('#ideaInput').focus();});
 $('#menuBtn').addEventListener('click',openSidebar);
 $('#backdrop').addEventListener('click',closeSidebar);
 $('#themeQuick').addEventListener('click',()=>{settings.theme=settings.theme==='dark'?'light':'dark';saveJSON('bako_settings',settings);applySettings();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar();}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&state.page==='create')handleGenerate(null);});

 /* create page */
 $('#generateBtn').addEventListener('click',()=>handleGenerate(null));
 $('#btnRegen').addEventListener('click',()=>{handleGenerate(state.lastOpts?Object.assign({},state.lastOpts):null);});
 $('#btnRandomIdea').addEventListener('click',()=>{
  const pool=IDEA_POOL[settings.uiLang==='ar'?'ar':'en'];
  $('#ideaInput').value=pick(pool[$('#selType').value]||pool.other);
 });
 $('#btnSaveProject').addEventListener('click',()=>{
  if(!state.currentResult){toast(t('t_err_empty'),'err');return;}
  const def=state.currentResult.idea.slice(0,40);
  openModal({title:t('m_name_title'),
   bodyHTML:'<label class="lbl">'+t('m_name_label')+'</label><input id="projNameInput" class="input" maxlength="60" value="'+esc(def)+'">',
   confirmText:t('m_save'),
   onConfirm:()=>{
    const inp=$('#projNameInput');
    const name=(inp&&inp.value.trim())||def;
    const list=loadArr('bako_projects');
    list.unshift({id:uid(),name:name,date:new Date().toISOString(),idea:state.currentResult.idea,pinned:false,favorite:false,opts:state.currentResult.opts,result:state.currentResult});
    saveArr('bako_projects',list);
    renderSaved();
    toast('💾 '+t('t_saved'));
   }});
 });
 $('#btnExport').addEventListener('click',()=>{
  if(!state.currentResult)return;
  const blob=new Blob(['\ufeff'+allText(state.currentResult)],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='BAKO_'+(state.currentResult.idea.slice(0,20).replace(/\s+/g,'_').replace(/[\\/:*?"<>|]/g,'')||'content')+'.txt';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('📄 '+t('t_exported'));
 });
 $('#btnCopyAll').addEventListener('click',e=>{
  if(!state.currentResult)return;
  copyText(allText(state.currentResult),e.currentTarget);
 });
 attachCopyHandler($('#resultsGrid'),()=>state.currentResult);

 /* ideas page */
 $('#btnGenIdea').addEventListener('click',()=>{
  const pool=IDEA_POOL[settings.uiLang==='ar'?'ar':'en'];
  const ty=$('#ideaType').value;
  const idea=pick(pool[ty]||pool.other);
  const out=$('#ideaOutput');
  out.classList.remove('hidden');
  out.innerHTML='<div class="gen-idea"><span class="badge">'+esc(t('type_'+ty))+'</span><p class="gen-idea-txt">💡 '+esc(idea)+'</p><div><button class="btn btn-primary" data-idea="'+esc(idea)+'" data-type="'+ty+'">'+t('use_idea')+'</button></div></div>';
 });
 $('#ideaOutput').addEventListener('click',e=>{const b=e.target.closest('[data-idea]');if(b)useIdea(b.dataset.idea,b.dataset.type);});
 $('#homeTrend').addEventListener('click',e=>{const b=e.target.closest('[data-idea]');if(b)useIdea(b.dataset.idea,b.dataset.type);});
 $('#trendList').addEventListener('click',e=>{const b=e.target.closest('[data-idea]');if(b)useIdea(b.dataset.idea,b.dataset.type);});

 /* thumbnail quick tool */
 $('#btnGenThumb').addEventListener('click',()=>{
  const idea=$('#thumbIdea').value.trim();
  if(!idea){toast(t('t_err_empty'),'err');return;}
  const lang=settings.uiLang==='ar'?'ar':'en';
  const res=generateContent({idea:idea,platform:'youtube',type:detectType(idea),lang:lang,tone:'energetic',length:'medium'});
  state.tempRes.thumb=res;
  const out=$('#thumbOutput');
  out.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  out.innerHTML=rcard(t('c_thumb'),thumbsBlock(res),null,0);
  toast(t('t_done'));
 });
 attachCopyHandler($('#thumbOutput'),()=>state.tempRes.thumb);

 /* voice quick tool */
 $('#btnGenVoice').addEventListener('click',()=>{
  const idea=$('#voiceIdea').value.trim();
  if(!idea){toast(t('t_err_empty'),'err');return;}
  const lang=settings.uiLang==='ar'?'ar':'en';
  const res=generateContent({idea:idea,platform:'youtube',type:detectType(idea),lang:lang,tone:'professional',length:'medium'});
  state.tempRes.voice=res;
  const out=$('#voiceOutput');
  out.setAttribute('dir',lang==='ar'?'rtl':'ltr');
  out.innerHTML=rcard(t('c_voice'),'<pre class="prewrap">'+esc(res.voice)+'</pre>',cbtn('voice'),0);
  toast(t('t_done'));
 });
 attachCopyHandler($('#voiceOutput'),()=>state.tempRes.voice);

 /* saved page */
 $('#savedList').addEventListener('click',e=>{
  const b=e.target.closest('[data-sact]');if(!b)return;
  const id=b.dataset.id;
  const list=loadArr('bako_projects');
  const p=list.find(x=>x.id===id);if(!p)return;
  const act=b.dataset.sact;
  if(act==='open'){
   $('#ideaInput').value=p.idea;
   if(p.opts){setVal('#selPlatform',p.opts.platform);setVal('#selType',p.opts.type);setVal('#selLang',p.opts.lang);setVal('#selTone',p.opts.tone);setVal('#selLen',p.opts.length);}
   state.currentResult=p.result;state.lastOpts=p.opts;
   renderResults(p.result);
   $('#resultsArea').classList.remove('hidden');
   navigate('create');
   toast('📂 '+t('t_opened'));
  }else if(act==='pin'){p.pinned=!p.pinned;saveArr('bako_projects',list);renderSaved();}
  else if(act==='fav'){p.favorite=!p.favorite;saveArr('bako_projects',list);renderSaved();}
  else if(act==='del'){
   openModal({title:t('m_del_title'),bodyHTML:'<p>'+esc(t('m_del_msg'))+'</p>',danger:true,
    onConfirm:()=>{saveArr('bako_projects',loadArr('bako_projects').filter(x=>x.id!==id));renderSaved();toast('🗑️ '+t('t_deleted'));}});
  }
 });

 /* settings page */
 $('#setProvider').addEventListener('change',updateApiFields);
 $('#btnSaveSettings').addEventListener('click',()=>{
  settings.theme=$('#setTheme').value;
  settings.uiLang=$('#setUiLang').value;
  settings.fontSize=$('#setFont').value;
  settings.apiProvider=$('#setProvider').value;
  settings.apiUrl=$('#setApiUrl').value.trim();
  settings.apiKey=$('#setApiKey').value.trim();
  settings.apiModel=$('#setModel').value.trim()||'gpt-4o-mini';
  saveJSON('bako_settings',settings);
  applySettings();
  toast('💾 '+t('s_saved_toast'));
 });
 $('#btnResetSettings').addEventListener('click',()=>{
  openModal({title:t('s_reset'),bodyHTML:'<p>'+esc(t('s_reset_msg'))+'</p>',danger:true,
   onConfirm:()=>{settings=Object.assign({},DEF_SETTINGS);saveJSON('bako_settings',settings);applySettings();toast('↩️ '+t('s_reset_toast'));}});
 });

 /* modal */
 $('#modalCancel').addEventListener('click',closeModal);
 $('#modalOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
 $('#modalConfirm').addEventListener('click',()=>{
  const fn=modalConfirmFn;modalConfirmFn=null;
  $('#modalOverlay').classList.add('hidden');
  if(fn)fn();
 });

 applySettings();
 navigate('home');
}
init();
</script>
